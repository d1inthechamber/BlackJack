name: Build Casino Chaos APK

on:
  push:
    branches: [main, codex/casino-chaos-v3.3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casino-chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Assets, lint, unit tests, release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify packaged assets
        run: python3 .github/check_assets.py
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, and signed release assembly
        run: gradle :app:lintRelease :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Stage candidate APK
        run: cp app/build/outputs/apk/release/app-release.apk casino-chaos-v3.3-candidate.apk
      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: casino-chaos-v3.3-candidate.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

  android-tests:
    name: Android interaction and visual tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run phone interaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            test_status=0
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.d1inthechamber.blackjack.CasinoSmokeTest,com.d1inthechamber.blackjack.TableSmokeTest,com.d1inthechamber.blackjack.UpgradeSmokeTest || test_status=$?
            mkdir -p screenshots
            for name in portrait-hit landscape-hit; do adb pull "/sdcard/Download/royal-felt-$name.png" "screenshots/$name.png" || true; done
            for room in carnival egypt iron west punk green; do adb pull "/sdcard/Download/royal-felt-room-$room.png" "screenshots/room-$room.png" || true; done
            for game in lobby slots solitaire poker settings rooms craps craps-win; do adb pull "/sdcard/Download/chaos-$game.png" "screenshots/chaos-$game.png" || true; done
            adb logcat -d -s AndroidRuntime > android-runtime.log
            exit $test_status
      - name: Upload phone screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-evidence
          path: |
            screenshots
            android-runtime.log
            app/build/reports/androidTests
          if-no-files-found: warn

  foldable-tests:
    name: Pixel Fold-equivalent layout tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run unfolded, folded, and landscape tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            test_status=0
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.d1inthechamber.blackjack.FoldableSmokeTest || test_status=$?
            mkdir -p foldable-screenshots
            for mode in unfolded folded landscape; do adb pull "/sdcard/Download/fold-$mode.png" "foldable-screenshots/$mode.png" || true; done
            adb logcat -d -s AndroidRuntime > foldable-runtime.log
            exit $test_status
      - name: Upload foldable screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foldable-test-evidence
          path: |
            foldable-screenshots
            foldable-runtime.log
            app/build/reports/androidTests
          if-no-files-found: warn

  publish-apk:
    name: Publish fully gated test APK
    needs: [validate, android-tests, foldable-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download signed candidate
        uses: actions/download-artifact@v4
        with:
          name: signed-release-candidate
      - name: Name install file
        run: mv casino-chaos-v3.3-candidate.apk casino-chaos-v3.3.apk
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: casino-chaos-apk-v3.3
          path: casino-chaos-v3.3.apk
          if-no-files-found: error
          retention-days: 30
